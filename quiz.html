<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毎日10問</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #FAF7F2; --card: #FFFFFF; --ink: #2B2B2B; --sub: #8A8178; --line: #ECE6DD; --soft: #F2EDE6;
    --accent: #E8772E; --accent-bg: #FFF4EC; --ok: #2E9E6A; --ok-bg: #E8F6EF; --ng: #D9534F; --ng-bg: #FCEDEC;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.7; padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header { padding: 18px 18px 6px; max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
  header .ttl { flex: 1; }
  header .date { color: var(--sub); font-size: 13px; }
  header h1 { margin: 2px 0 0; font-size: 24px; letter-spacing: .02em; }
  .hbtn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 700; }
  main { max-width: 640px; margin: 0 auto; padding: 6px 14px 24px; }

  .card { background: var(--card); border-radius: 16px; padding: 18px 16px; margin: 14px 0; box-shadow: 0 1px 3px rgba(60,40,20,.06); border: 1px solid var(--line); }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .no { font-weight: 700; font-size: 14px; }
  .badge { color: #fff; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .grade { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 1px 7px; }
  .unit { color: var(--sub); font-size: 13px; }
  .mark { margin-left: auto; font-size: 22px; font-weight: 800; line-height: 1; }
  .mark.ok { color: var(--ok); } .mark.ng { color: var(--ng); }
  .qtext { white-space: pre-wrap; word-break: break-word; margin: 0 0 14px; font-size: 16.5px; }

  .choices { display: grid; gap: 10px; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .choice .lb { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
  .choice .tx { white-space: pre-wrap; word-break: break-word; }
  .choice.picked { border-color: var(--accent); background: var(--accent-bg); }
  .choice.picked .lb { background: var(--accent); color: #fff; }
  .choice[disabled] { cursor: default; }
  .choice.is-correct { border-color: var(--ok); background: var(--ok-bg); }
  .choice.is-correct .lb { background: var(--ok); color: #fff; }
  .choice.is-wrong { border-color: var(--ng); background: var(--ng-bg); }
  .choice.is-wrong .lb { background: var(--ng); color: #fff; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  .tag.you { background: var(--soft); color: var(--sub); }
  .tag.ans { background: var(--ok); color: #fff; }

  .expl { margin-top: 14px; background: #FBF8F3; border-radius: 12px; padding: 12px 14px; border-left: 4px solid var(--accent); }
  .expl h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); display: flex; justify-content: space-between; }
  .expl h3 small { color: var(--sub); font-weight: 400; }
  .expl p { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 15px; }

  .score { text-align: center; padding: 22px 16px; }
  .score .big { font-size: 46px; font-weight: 800; line-height: 1.1; }
  .score .big small { font-size: 22px; color: var(--sub); font-weight: 700; }
  .score .msg { margin-top: 6px; font-weight: 700; }
  .face { font-size: 64px; line-height: 1.1; margin-bottom: 4px; }
  .kao { font-size: 22px; font-weight: 700; color: var(--accent); margin: 2px 0 8px; letter-spacing: .02em; }
  .rank-label { display: inline-block; font-size: 13px; font-weight: 800; color: #fff; border-radius: 999px; padding: 3px 14px; margin-bottom: 6px; }
  .pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .pop2 { animation: pop .6s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .shake { animation: pop .5s both, shake .6s .5s both; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .gift { font-size: 12px; font-weight: 800; color: #8E5BD0; background: #F3ECFB; border-radius: 6px; padding: 1px 8px; }
  .goal-bar { height: 16px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 8px 0 6px; }
  .goal-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #F2A65A, #E8772E); transition: width .8s ease; }
  .goal-num { display: flex; justify-content: space-between; align-items: baseline; }
  .goal-num b { font-size: 26px; }
  .goal-num span { color: var(--sub); font-size: 13px; }
  .reward { background: var(--accent-bg); border-radius: 12px; padding: 10px 12px; font-weight: 800; color: var(--accent); margin-top: 8px; text-align: center; }
  .contrib { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--sub); }
  .contrib b { color: var(--ink); }
  .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bdg { text-align: center; background: var(--accent-bg); border-radius: 12px; padding: 8px 2px 6px; }
  .bdg .i { font-size: 26px; line-height: 1.2; }
  .bdg .n { font-size: 10px; font-weight: 700; line-height: 1.3; display: block; }
  .bdg.off { background: var(--soft); }
  .bdg.off .i { filter: grayscale(1); opacity: .25; }
  .bdg.off .n { color: var(--sub); font-weight: 400; }
  .ticket { margin-top: 10px; text-align: center; font-size: 13px; background: var(--soft); border-radius: 10px; padding: 7px; }
  .newb { display: flex; align-items: center; gap: 12px; background: var(--accent-bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; text-align: left; }
  .newb .i { font-size: 32px; }
  .newb b { display: block; }
  .newb small { color: var(--sub); }
  .fld { margin: 12px 0; }
  .fld label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .fld label small { color: var(--sub); font-weight: 400; }
  .fld input, .fld textarea, .fld select { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
  .fld textarea { min-height: 84px; resize: vertical; }
  .fld input:focus, .fld textarea:focus, .fld select:focus { outline: none; border-color: var(--accent); }
  .fld.ok input { border-color: var(--ok); background: var(--ok-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; font-weight: 700; color: var(--sub); }
  .chips button.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
  .pill { display: inline-block; background: var(--accent-bg); color: var(--accent); font-weight: 700; padding: 4px 14px; border-radius: 999px; font-size: 14px; margin-top: 8px; }

  /* ホーム */
  .me { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
  .me .hero { grid-column: 1 / -1; padding: 6px 0 10px; }
  .me .hero .lbl { font-size: 13px; color: var(--sub); }
  .me .hero .val { font-size: 52px; font-weight: 800; line-height: 1.05; color: var(--accent); }
  .me .hero .val.na { font-size: 22px; color: var(--sub); padding: 14px 0 6px; }
  .me .stat { background: var(--soft); border-radius: 12px; padding: 8px 4px; }
  .me .stat b { display: block; font-size: 20px; }
  .me .stat span { font-size: 11px; color: var(--sub); }
  .hist { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 6px; }
  .hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .hist .hb { width: 100%; max-width: 22px; border-radius: 5px 5px 2px 2px; background: var(--accent); min-height: 2px; }
  .hist .hb.none { background: var(--soft); height: 4px !important; }
  .hist .n { font-size: 10px; color: var(--ink); font-weight: 700; }
  .hist .d { font-size: 9px; color: var(--sub); margin-top: 2px; white-space: nowrap; }
  .row { display: grid; grid-template-columns: 40px 1fr 44px 74px; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
  .row .rt { text-align: right; font-weight: 700; font-size: 13px; }
  .row .hs { text-align: center; border-radius: 10px; padding: 3px 0; line-height: 1.15; }
  .row .hs b { display: block; font-size: 20px; }
  .row .hs small { font-size: 10px; color: var(--sub); }
  .row .hs.na b { font-size: 12px; color: var(--sub); padding: 4px 0 1px; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; margin-left: 8px; vertical-align: 1px; }
  .seg button { border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: var(--sub); padding: 3px 12px; border-radius: 999px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn2 { display: block; width: 100%; border: 2px solid var(--accent); background: #fff; color: var(--accent); border-radius: 14px; padding: 12px; font: inherit; font-weight: 800; font-size: 15px; }
  .retry-head { text-align: center; }
  .retry-head .big { font-size: 30px; font-weight: 800; }
  .bar-bg { height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; }
  .bar-fg { height: 100%; border-radius: 999px; }
  .fam { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .fam:first-of-type { border-top: 0; }
  .fam .rank { font-weight: 800; color: var(--sub); text-align: center; }
  .fam .nm { font-weight: 700; }
  .fam .nm small { display: block; font-weight: 400; color: var(--sub); font-size: 12px; }
  .fam .hv { text-align: right; font-weight: 800; font-size: 20px; line-height: 1.1; }
  .fam .hv small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); }
  .fam.mine { background: var(--accent-bg); margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .tbl { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 13px; }
  .tbl th { font-weight: 700; color: var(--sub); font-size: 12px; }
  .tbl td { text-align: center; border-radius: 8px; padding: 7px 0; font-weight: 700; }
  .tbl td.nm { text-align: left; padding-left: 4px; color: var(--ink); white-space: nowrap; }
  .exam { text-align: center; font-weight: 800; color: var(--ng); margin: 4px 0 0; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(250,247,242,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .bar button { display: block; width: 100%; max-width: 608px; margin: 0 auto; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-weight: 800; font-size: 17px; background: var(--accent); color: #fff; }
  .bar button[disabled] { background: #D8CFC4; }
  .hidden { display: none; }
  .center { text-align: center; color: var(--sub); padding: 60px 0; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { background: var(--ng-bg); color: #8B2E2B; border-radius: 12px; padding: 16px; margin-top: 20px; }
  .err button { margin-top: 10px; border: 0; background: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700; color: var(--ng); }
  .note { text-align: center; color: var(--sub); font-size: 12px; margin-top: 14px; line-height: 1.6; white-space: pre-line; }
</style>
</head>
<body>
<header>
  <div class="ttl">
    <div class="date" id="dateLabel">&nbsp;</div>
    <h1 id="title">毎日10問</h1>
  </div>
  <button id="navBtn" class="hbtn hidden"></button>
</header>
<main id="app">
  <div class="center"><div class="spinner"></div>読み込み中…</div>
</main>
<div id="bar" class="bar hidden"><button id="barBtn"></button></div>

<script>
  // ===== 設定 =====
  const LIFF_ID = '2012771893-qDjyNBRF';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycby5voXO6CgykDBHErkboHFmoId-nkDrF8nCIF0E__RNRLQ0pAMXo2K42BAQ01Q-MmD_/exec';
  // ================

  const LABELS = ['ア', 'イ', 'ウ', 'エ'];
  const SUBJECTS = ['数学', '英語', '理科', '社会', '国語'];
  const COLORS = { 数学: '#3B7DD8', 英語: '#8E5BD0', 理科: '#2E9E6A', 社会: '#C9822B', 国語: '#D9534F' };
  const state = { date: null, questions: [], picks: {}, quizData: null };

  const $ = s => document.querySelector(s);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  // 24時間有効の合言葉（セッション）。あればLINEの本人確認を省略できる
  function getSession() { try { return localStorage.getItem('fq_session') || ''; } catch (e) { return ''; } }
  function setSession(v) { try { if (v) localStorage.setItem('fq_session', v); else localStorage.removeItem('fq_session'); } catch (e) {} }

  async function api(action, extra) {
    let idToken = '';
    try { idToken = liff.getIDToken() || ''; } catch (e) {}
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, idToken, session: getSession() }, extra || {})),
    });
    const data = await res.json();
    if (data.session) setSession(data.session);
    if (!data.ok) {
      if (data.code === 'TOKEN_EXPIRED' || data.code === 'NO_TOKEN') {
        setSession('');
        liff.logout();
        liff.login({ redirectUri: location.href });
        throw new Error('ログインし直しています…');
      }
      throw new Error(data.error || 'エラーが発生しました');
    }
    return data;
  }

  function loading() {
    $('#app').innerHTML = '<div class="center"><div class="spinner"></div>読み込み中…</div>';
    $('#bar').classList.add('hidden');
  }
  function setBar(text, fn, disabled) {
    const btn = $('#barBtn');
    btn.textContent = text;
    btn.disabled = !!disabled;
    btn.onclick = fn;
    $('#bar').classList.remove('hidden');
  }
  function setNav(text, fn) {
    const b = $('#navBtn');
    if (!text) { b.classList.add('hidden'); return; }
    b.textContent = text;
    b.onclick = fn;
    b.classList.remove('hidden');
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      const params = new URLSearchParams(location.search);
      if (params.get('view') === 'home') return showHome();
      await openQuiz(params.get('date') || '');
    } catch (e) {
      showError(e.message || String(e));
    }
  }

  async function openQuiz(date) {
    loading();
    try {
      const data = await api('quiz', { date: date || '' });
      state.quizData = data;
      state.date = data.date;
      $('#dateLabel').textContent = data.dateLabel + (data.today ? '' : '（過去の問題）');
      if (data.answered) renderResults(data);
      else renderQuiz(data.questions);
    } catch (e) {
      showError(e.message || String(e), true);
    }
  }

  function metaRow(q, i, extra) {
    const m = el('div', 'meta');
    m.appendChild(el('span', 'no', '第' + (i + 1) + '問'));
    const b = el('span', 'badge', (q.subject === '数学' && /^小/.test(q.grade || '')) ? '算数' : q.subject);
    b.style.background = COLORS[q.subject] || '#888';
    m.appendChild(b);
    if (q.grade) m.appendChild(el('span', 'grade', q.grade));
    if (q.author) m.appendChild(el('span', 'gift', '🎁 ' + q.author + 'さんからの出題'));
    else m.appendChild(el('span', 'unit', q.unit));
    if (extra) m.appendChild(extra);
    return m;
  }

  /* ---------- 出題 ---------- */
  function renderQuiz(questions) {
    state.questions = questions;
    state.picks = {};
    const bonusN = questions.filter(q => q.author).length;
    $('#title').textContent = '今日の' + (questions.length - bonusN) + '問' + (bonusN ? '＋ボーナス' : '');
    setNav('成績', showHome);
    const app = $('#app');
    app.innerHTML = '';
    questions.forEach((q, i) => {
      const card = el('section', 'card');
      card.id = 'q' + i;
      card.appendChild(metaRow(q, i));
      card.appendChild(el('p', 'qtext', q.question));
      const box = el('div', 'choices');
      q.choices.forEach((c, j) => {
        const btn = el('button', 'choice');
        btn.type = 'button';
        btn.appendChild(el('span', 'lb', LABELS[j]));
        btn.appendChild(el('span', 'tx', c));
        btn.addEventListener('click', () => pick(i, j, box));
        box.appendChild(btn);
      });
      card.appendChild(box);
      app.appendChild(card);
    });
    updateBar();
  }

  function pick(i, j, box) {
    const q = state.questions[i];
    const first = state.picks[q.qid] === undefined;
    state.picks[q.qid] = j;
    [...box.children].forEach((b, k) => b.classList.toggle('picked', k === j));
    updateBar();
    if (first) {
      const next = state.questions.findIndex(x => state.picks[x.qid] === undefined);
      if (next >= 0) setTimeout(() => document.getElementById('q' + next).scrollIntoView({ behavior: 'smooth', block: 'start' }), 250);
    }
  }

  function updateBar() {
    const n = Object.keys(state.picks).length;
    const total = state.questions.length;
    setBar(n < total ? '採点する（' + n + ' / ' + total + '）' : '採点する', submit, n < total);
  }

  async function submit() {
    const btn = $('#barBtn');
    btn.disabled = true;
    btn.textContent = '採点中…';
    try {
      const data = await api('submit', { date: state.date, answers: state.picks });
      state.quizData = data;
      renderResults(data, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      alertInline(e.message || String(e));
      updateBar();
    }
  }

  /* ---------- 結果と解説 ---------- */
  // 点数に応じた顔文字とひとこと（ソウのアイデア）
  function scoreTier(score, total) {
    const r = total ? score / total : 0;
    const pick = a => a[Math.floor(Math.random() * a.length)];
    if (r === 1) return { label: 'PERFECT!', color: '#E8A400', face: '🏆', kao: pick(['(ﾉ≧∀≦)ﾉ', '٩(ˊᗜˋ*)و', '＼(^o^)／']), msg: pick(['全問正解！天才か！？', 'パーフェクト！今日は最高の日！', '満点！家族に自慢しよう']), confetti: true };
    if (r >= 0.8) return { label: 'GREAT!', color: '#E8772E', face: pick(['😆', '🤩']), kao: pick(['(๑˃̵ᴗ˂̵)و', 'ヽ(•̀ω•́ )ゝ✧', '(* ´ ▽ ` *)']), msg: pick(['すごい！あと少しで満点！', 'いい調子！この勢いでいこう', 'ナイス！かなりできてる！']) };
    if (r >= 0.6) return { label: 'GOOD', color: '#2E9E6A', face: pick(['😊', '🙂']), kao: pick(['(´▽`)', '( ´ ▽ ` )ﾉ', '(・∀・)']), msg: pick(['いい感じ！間違えたところを見直そう', 'まずまず！解き直しで仕上げよう', 'なかなか！あと一歩！']) };
    if (r >= 0.4) return { label: 'まあまあ', color: '#8A8178', face: pick(['😐', '🤔']), kao: pick(['(・へ・)', '( ˘ω˘ )', '(´-ω-`)']), msg: pick(['まあまあ…解説を読めば伸びるはず', '惜しい！解き直しでリベンジ', 'ここからが勝負！']) };
    return { label: 'ざんねん…', color: '#5B7DB1', face: pick(['😢', '😭']), kao: pick(['(´；ω；`)', '(；ω；)', '( ´•̥̥̥ω•̥̥̥` )']), msg: pick(['今日はざんねん…でも解き直せばOK！', 'くやしい！明日リベンジしよう', 'ドンマイ！解説を読んで覚えよう']), shake: true };
  }

  function confetti() {
    const colors = ['#E8772E', '#3B7DD8', '#2E9E6A', '#C9822B', '#D9534F', '#8E5BD0', '#E8A400'];
    for (let i = 0; i < 80; i++) {
      const c = el('div', 'confetti');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  function renderResults(data, fresh) {
    $('#title').textContent = '結果と解説';
    setNav('成績', showHome);
    setBar('ホームで成績を見る', showHome);

    const sc = el('section', 'card score');

    sc.appendChild(el('div', 'rank-label' + (anim ? ' pop' : ''), tier.label)).style.background = tier.color;
    sc.appendChild(el('div', 'face' + (anim ? (tier.shake ? ' shake' : ' pop') : ''), tier.face));
    sc.appendChild(el('div', 'kao' + (anim ? ' pop2' : ''), tier.kao));

    big.appendChild(el('small', null, ' / ' + data.total));
    sc.appendChild(big);
    sc.appendChild(el('div', 'msg', tier.msg));
    if (anim && tier.confetti) setTimeout(confetti, 300);
    if (data.newBadges && data.newBadges.length) {

    if (data.teamGoal && !data.teamGoal.upcoming) {
      const tg = data.teamGoal;
      sc.appendChild(el('div', 'pill', '🍖 ' + tg.label + 'のチーム目標 ' + tg.correct + ' / ' + tg.goal + (data.todayCorrect ? '（今日 +' + data.todayCorrect + '）' : '') + (tg.achieved ? ' 達成！' : '')));

    if (data.streak > 0) sc.appendChild(el('div', 'pill', '🔥 ' + data.streak + '日連続'));

      rb.style.marginTop = '14px';
      rb.onclick = () => startRetry(wrong, () => renderResults(data));

    app.appendChild(sc);

    data.results.forEach((r, i) => {
      const card = el('section', 'card');
      card.appendChild(metaRow(r, i, el('span', 'mark ' + (r.correct ? 'ok' : 'ng'), r.correct ? '○' : '×')));
      card.appendChild(el('p', 'qtext', r.question));
      const box = el('div', 'choices');
      r.choices.forEach((c, j) => {

  /* ---------- 解き直し（成績には記録しない） ---------- */
  function startRetry(items, back) {
    if (!items || !items.length) { back(); return; }
    // 選択肢の並びを毎回シャッフル
    const list = items.map(r => {
      const order = r.choices.map((_, i) => i).sort(() => Math.random() - 0.5);
      return Object.assign({}, r, { choices: order.map(i => r.choices[i]), answerIndex: order.indexOf(r.answerIndex) });
    });
    $('#title').textContent = '解き直し';
    setNav('戻る', back);
    const app = $('#app');
    app.innerHTML = '';
    const head = el('section', 'card retry-head');
    const cnt = el('div', 'big', '0 / ' + list.length);
    head.appendChild(cnt);
    head.appendChild(el('div', 'note', 'タップするとすぐに答え合わせ。成績・偏差値には記録されません。'));
    app.appendChild(head);
    let done = 0;
    const missed = [];
    list.forEach((r, i) => {
      const card = el('section', 'card');
      card.id = 'r' + i;
      card.appendChild(metaRow(r, i));
      card.appendChild(el('p', 'qtext', r.question));
      const box = el('div', 'choices');
      const btns = r.choices.map((c, j) => {
        const b = el('button', 'choice');
        b.type = 'button';
        b.appendChild(el('span', 'lb', LABELS[j]));
        b.appendChild(el('span', 'tx', c));
        b.onclick = () => {
          btns.forEach(x => { x.disabled = true; });
          btns[r.answerIndex].classList.add('is-correct');
          const ok = j === r.answerIndex;
          if (!ok) { b.classList.add('is-wrong'); missed.push(items[i]); }
          card.querySelector('.meta').appendChild(el('span', 'mark ' + (ok ? 'ok' : 'ng'), ok ? '○' : '×'));
          const ex = el('div', 'expl');
          ex.appendChild(el('h3', null, '解説'));
          ex.appendChild(el('p', null, r.explanation));
          card.appendChild(ex);
          done++;
          cnt.textContent = done + ' / ' + list.length;
          if (done === list.length) finish();
          else {
            const next = document.getElementById('r' + (i + 1));
            if (next) setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'start' }), 900);
          }
        };
        box.appendChild(b);
        return b;
      });
      card.appendChild(box);
      app.appendChild(card);
    });
    $('#bar').classList.add('hidden');
    function finish() {
      if (missed.length) {
        setBar('まだ間違えた' + missed.length + '問をもう一度', () => { window.scrollTo({ top: 0 }); startRetry(missed.slice(), back); });
      } else {
        cnt.textContent = '全問クリア！🎉 (ﾉ≧∀≦)ﾉ';
        confetti();
        setBar('戻る', back);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

        box.appendChild(b);
      });

    };
    const inputs = {};
    const textField = (label, key, opts) => {
      const f = el('div', 'fld' + (opts && opts.ok ? ' ok' : ''));
      const l = el('label', null, label);
      if (opts && opts.hint) l.appendChild(el('small', null, '　' + opts.hint));

      if (opts && opts.ph) inp.placeholder = opts.ph;
      inp.maxLength = opts && opts.max ? opts.max : 80;
      inputs[key] = inp;
      f.appendChild(inp);
      card.appendChild(f);
    };

    chipField('教科', 'subject', ['国語', '数学', '英語', '理科', '社会', 'その他']);
    textField('問題文', 'question', { multi: true, max: 300, ph: '例）日本でいちばん高い山は？' });
    textField('正解', 'correct', { ok: true, ph: '例）富士山' });

    textField('解説', 'explanation', { multi: true, max: 400, hint: 'なくてもOK', ph: '例）富士山は3776m。2番目に高いのは北岳です。' });
    card.appendChild(el('p', 'note', '家族全員に、ボーナス問題（11問目）として出題されます。\n自分の問題も自分に出るので、確実に1点ゲットのチャンス！\n選択肢は自動でシャッフルされます。'));
    app.appendChild(card);

    setBar('この問題を送る', async () => {
      const item = Object.assign({}, form);
      Object.keys(inputs).forEach(k => { item[k] = inputs[k].value.trim(); });
      const btn = $('#barBtn');
      btn.disabled = true;
      btn.textContent = '送信中…';
      try {
        const r = await api('contribute', { item });
        app.innerHTML = '';
        const done = el('section', 'card score');
        done.appendChild(el('div', 'face pop', '🎁'));
        done.appendChild(el('div', 'kao pop2', '٩(ˊᗜˋ*)و'));
        done.appendChild(el('div', 'msg', '問題を受け付けました！'));
        done.appendChild(el('p', 'note', '朝4時の配信で、ボーナス問題として家族に届きます。\n（出題待ちの問題：全部で ' + r.waiting + '問）'));
        const again = el('button', 'btn2', 'もう1問出す');
        again.style.marginTop = '12px';
        again.onclick = renderContrib;
        done.appendChild(again);

        setBar('ホームへ戻る', showHome);
        window.scrollTo({ top: 0 });
      } catch (e) {
        alertInline(e.message || String(e));
        btn.disabled = false;
        btn.textContent = 'この問題を送る';
      }
    });
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(2) + ')';
  }

  function showError(msg, withHome) {
    $('#bar').classList.add('hidden');
    const app = $('#app');
    app.innerHTML = '';
    const box = el('div', 'err', msg);
    box.appendChild(el('br'));
    const btn = el('button', null, 'もう一度読み込む');
    btn.onclick = () => location.reload();
    box.appendChild(btn);
    if (withHome) {
      const h = el('button', null, 'ホームへ');
      h.style.marginLeft = '8px';
      h.onclick = showHome;
      box.appendChild(h);
    }
    app.appendChild(box);
  }

  function alertInfo(msg) {
    const box = el('div', 'card');
    box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:96px;z-index:60;white-space:pre-line;text-align:center;font-weight:700;max-width:608px;margin:0 auto;';
    box.textContent = msg;
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2500);
  }

  function alertInline(msg) {
    const box = el('div', 'err', msg);
    $('#app').prepend(box);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => box.remove(), 5000);
  }

  main();
</script>
</body>
</html>
